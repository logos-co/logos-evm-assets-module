[package]
name = "evm_assets_module"
version = "0.1.0"
edition = "2021"
description = "Reusable native and ERC-20 balances, transfer building and history decoration."
rust-version = "1.89"

[workspace]
resolver = "3"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
alloy = { version = "1", default-features = false, features = ["std", "sol-types"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }

[features]
default = ["logos_module"]
logos_module = ["dep:logos-rust-sdk"]
